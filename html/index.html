<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AnaTil</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="header" id="header">
    <div class="header__container">
        <div class="logo">AnaTil</div>

        <nav class="nav">
            <a href="#" data-key="about">О нас</a>
            <a href="#" data-key="benefits">Преимущества</a>
            <a href="#" data-key="courses">Курсы</a>
            <a href="#" data-key="contacts">Контакты</a>
        </nav>


        <div class="header__actions">
            <div class="lang-switch">
                <button data-lang="kz" class="lang">KZ</button>
                <button data-lang="ru" class="lang active">RU</button>
                <button data-lang="en" class="lang">EN</button>
            </div>

            <button class="btn" id="cta">Проверить свой уровень</button>
        </div>
    </div>
</header>

<section class="hero">
    <div class="hero__top">
        <h1 class="hero__title">
            Поможем поднять<br>
            ваш казахский язык
        </h1>

        <p class="hero__subtitle">
            Начните изучать казахский язык вместе с нами и
            поднимите свой уровень до C1
        </p>
    </div>

    <div class="hero__card">
        <div class="hero__content">
            <div class="badge">
                Уровни Казахского языка
            </div>

            <div class="tags">
                <span>A1 - Элементарный</span>
                <span>A2 - Базовый</span>
                <span>B1 - Средний</span>
                <span>B2 - Выше среднего</span>
                <span>C1 - Высокий</span>
            </div>

            <button class="hero__btn">Проверить свой уровень</button>
        </div>
    </div>
</section>


<script src="/scripts/script.js"></script>
</body>
</html>
