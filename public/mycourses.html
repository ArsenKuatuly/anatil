<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Доступные курсы</title>

    <style>
        .profile-app {
            display: flex;
            min-height: 100vh;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .profile-sidebar {
            width: 240px;
            background: #1e88e5;
            color: #fff;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-sidebar__avatar-wrapper {
            width: 96px;
            height: 96px;
            margin-bottom: 12px;
        }

        .profile-sidebar__avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.6);
        }

        .profile-sidebar__welcome {
            text-align: center;
            font-size: 14px;
            margin-bottom: 32px;
            font-weight: bold;
        }

        .profile-sidebar__menu-link {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 10px 0;
            opacity: 0.9;
        }

        .profile-sidebar__menu-link--active {
            font-weight: bold;
            opacity: 1;
        }

        .profile-content {
            flex: 1;
            padding: 40px;
            background: #ffffff;
            border-radius: 16px 0 0 16px;
        }

        .profile-content__title {
            margin-top: 0;
            color: #333;
        }

        .profile-sidebar__back-btn {
            margin-top: auto;
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .profile-sidebar__back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        #testActions button {
            margin-right: 10px;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #1e88e5;
            color: #fff;
        }

        #testActions button:hover {
            opacity: 0.9;
        }

        #historyBlock {
            background: #f7f9fc;
            padding: 16px;
            border-radius: 8px;
        }


    </style>
</head>
<body>

<div class="profile-app">
    <aside class="profile-sidebar">

        <div class="profile-sidebar__avatar-wrapper">
            <img
                    id="avatarImg"
                    src="/uploads/avatars/default.png"
                    class="profile-sidebar__avatar-img"
                    alt="Avatar"
            />

        </div>

        <div class="profile-sidebar__welcome">
            Добро пожаловать,<br>
            <span id="sidebarLogin">arsen1</span>
        </div>

        <nav>
            <a href="/profile.html" class="profile-sidebar__menu-link">
                Мой профиль
            </a>
            <a href="/mycourses.html" class="profile-sidebar__menu-link profile-sidebar__menu-link--active">
                Доступные курсы
            </a>

        </nav>

        <button class="profile-sidebar__back-btn" id="backBtn">
            ← Назад
        </button>

    </aside>

    <main class="profile-content">
        <h2 class="profile-content__title">
            Ваш уровень
        </h2>

        <div id="testResultBlock"></div>
        <div id="testActions" style="margin-top:20px; display:none;">
            <button id="retryTestBtn">Сдать тест заново</button>
            <button id="historyBtn">История попыток</button>
        </div>

        <div id="historyBlock" style="margin-top:20px; display:none;"></div>

    </main>

</div>

<script src="usersidebar.js"></script>
<script>
    const resultBlock = document.getElementById("testResultBlock");
    const actionsBlock = document.getElementById("testActions");
    const historyBlock = document.getElementById("historyBlock");

    const retryBtn = document.getElementById("retryTestBtn");
    const historyBtn = document.getElementById("historyBtn");

    fetch("/api/my-result")
        .then(res => res.json())
        .then(data => {
            if (!data.success || !data.result) {
                resultBlock.innerHTML = `
                <p>
                    Вы ещё не проходили тест.<br>
                    <a href="/test.html"><b>Пройдите тест, чтобы узнать ваш уровень</b></a>
                </p>
            `;
                return;
            }

            resultBlock.innerHTML = `
            <p><b>Набранный вами балл:</b> ${data.result.total_score}</p>
            <p><b>Ваш уровень:</b> ${data.result.level}</p>
            <p style="opacity:0.6;font-size:13px">
                Последнее прохождение:
                ${new Date(data.result.created_at).toLocaleDateString()}
            </p>
        `;

            actionsBlock.style.display = "block";
        })
        .catch(err => {
            console.error(err);
            resultBlock.innerHTML = "<p>Ошибка загрузки результата</p>";
        });

    /* ===== СДАТЬ ЗАНОВО ===== */
    retryBtn.addEventListener("click", () => {
        window.location.href = "/test.html";
    });

    /* ===== ИСТОРИЯ ПОПЫТОК ===== */
    historyBtn.addEventListener("click", () => {
        historyBlock.style.display = "block";
        historyBlock.innerHTML = "Загрузка истории...";

        fetch("/api/test-history")
            .then(res => res.json())
            .then(data => {
                if (!data.success || data.results.length === 0) {
                    historyBlock.innerHTML = "<p>История пуста</p>";
                    return;
                }

                historyBlock.innerHTML = data.results.map((r, i) => `
                <div style="margin-bottom:10px;">
                    <b>Попытка ${i + 1}</b><br>
                    Балл: ${r.total_score} | Уровень: ${r.level}<br>
                    <span style="opacity:0.6;font-size:12px">
                        ${new Date(r.created_at).toLocaleString()}
                    </span>
                </div>
            `).join("");
            })
            .catch(() => {
                historyBlock.innerHTML = "<p>Ошибка загрузки истории</p>";
            });
    });
</script>



</body>
</html>
