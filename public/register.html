<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Регистрация</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="auth auth--register">

    <!-- 🔝 Верхний блок -->
    <div class="auth__top">
        <div class="logo">AnaTil</div>

        <a href="/index.html" class="auth__back-btn">
            ← Вернуться на главную
        </a>
    </div>

    <!-- 🧾 Карточка -->
    <div class="auth__card">
        <h2 class="auth__title">Регистрация</h2>

        <label class="auth__label">Логин</label>
        <input class="auth__input" type="text" id="login" />

        <label class="auth__label">Пароль</label>
        <div class="auth__password-wrapper">
            <input
                    class="auth__input auth__input--password js-password"
                    type="password"
                    name="password"
            />
            <img
                    src="/imgs/showpass.png"
                    alt="Показать пароль"
                    class="auth__toggle-password js-toggle-password"
            />
        </div>

        <label class="auth__label">Повторите пароль</label>
        <div class="auth__password-wrapper">
            <input
                    class="auth__input auth__input--password js-password"
                    type="password"
                    name="passwordRepeat"
            />
            <img
                    src="/imgs/showpass.png"
                    alt="Показать пароль"
                    class="auth__toggle-password js-toggle-password"
            />
        </div>

        <button class="auth__button" id="registerBtn">
            Создать аккаунт
        </button>

        <p class="auth__footer">
            Уже есть аккаунт?
            <a href="/auth.html" class="auth__link">Войти</a>
        </p>

        <p class="auth__message" id="message"></p>
    </div>
</div>

<script src="/scripts/register.js"></script>
<script src="/scripts/showpass.js"></script>
</body>
</html>
