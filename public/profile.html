<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профиль пользователя</title>

    <style>
        .profile-app {
            display: flex;
            min-height: 100vh;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .profile-sidebar {
            width: 240px;
            background: #1e88e5;
            color: #fff;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-sidebar__avatar-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
            margin-bottom: 12px;
        }

        .profile-sidebar__avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.6);
        }

        .profile-sidebar__avatar-overlay {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(0,0,0,0.45);
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            cursor: pointer;
        }

        .profile-sidebar__avatar-wrapper:hover
        .profile-sidebar__avatar-overlay {
            opacity: 1;
        }

        .profile-sidebar__welcome {
            text-align: center;
            font-size: 14px;
            margin-bottom: 32px;
            font-weight: bold;
        }

        .profile-sidebar__menu-link {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 10px 0;
            opacity: 0.9;
        }

        .profile-sidebar__menu-link--active {
            font-weight: bold;
            opacity: 1;
        }

        .profile-content {
            flex: 1;
            padding: 40px;
            background: #ffffff;
            border-radius: 16px 0 0 16px;
        }

        .profile-content__title {
            margin-top: 0;
            margin-bottom: 24px;
            color: #333;
        }

        .profile-form__grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 32px;
            max-width: 800px;
        }

        .profile-form__field-label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }

        .profile-form__input,
        .profile-form__select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: #f9fafb;
        }

        .profile-form__actions {
            margin-top: 30px;
        }

        .profile-form__submit {
            background: #1e88e5;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }

        .profile-sidebar__back-btn {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            margin-bottom: 20px;
        }


        /* убираем прижатие вниз */
        .profile-sidebar__back-btn--top {
            margin-top: 0;
        }



        .profile-sidebar__back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }



        #testActions button {
            margin-right: 10px;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #1e88e5;
            color: #fff;
        }

        #testActions button:hover {
            opacity: 0.9;
        }

        #historyBlock {
            background: #f7f9fc;
            padding: 16px;
            border-radius: 8px;
        }

        .profile-section {
            margin-bottom: 48px;
        }

        .profile-section--level {
            padding-top: 32px;
            border-top: 1px solid #eee;
        }

    </style>
</head>
<body>

<header class="course-header">
    <h1>Казахский язык — базовый уровень</h1>
    <p>
        Базовый курс для начинающих. Алфавит, простые слова,
        базовая грамматика и разговорные фразы.
    </p>
</header>

<div class="profile-app">
    <aside class="profile-sidebar">

        <button class="profile-sidebar__back-btn" id="backBtn">
            На главную
        </button>
        <!-- AVATAR -->
        <div class="profile-sidebar__avatar-wrapper">
            <img
                    src="/uploads/avatars/default.png"
                    class="profile-sidebar__avatar-img"
                    id="avatarImg"
                    alt="Avatar"
            />

            <label class="profile-sidebar__avatar-overlay">
                Сменить
                <input type="file" id="avatarInput" accept="image/*" hidden />
            </label>
        </div>

        <div class="profile-sidebar__welcome">
            Добро пожаловать,<br>
            <span id="sidebarLogin">arsen1</span>
        </div>

        <nav>
            <a href="/profile.html" class="profile-sidebar__menu-link profile-sidebar__menu-link--active">
                Мой профиль
            </a>
            <a href="/mycourses.html" class="profile-sidebar__menu-link">
                Доступные курсы
            </a>

        </nav>




    </aside>

    <main class="profile-content">

        <!-- ===== ЛИЧНАЯ ИНФОРМАЦИЯ ===== -->
        <section class="profile-section">
            <h2 class="profile-content__title">Личная информация</h2>

            <form class="profile-form" id="profileForm">
                <div class="profile-form__grid">

                    <div>
                        <label class="profile-form__field-label">Имя</label>
                        <input class="profile-form__input" name="first_name" />
                    </div>

                    <div>
                        <label class="profile-form__field-label">Личный телефон</label>
                        <input class="profile-form__input" name="phone" />
                    </div>

                    <div>
                        <label class="profile-form__field-label">Фамилия</label>
                        <input class="profile-form__input" name="last_name" />
                    </div>

                    <div>
                        <label class="profile-form__field-label">Страна, город</label>
                        <select class="profile-form__select" name="location">
                            <option value="">Выберите</option>
                            <option>Казахстан, Астана</option>
                            <option>Казахстан, Алматы</option>
                            <option>Казахстан, Шымкент</option>
                            <option>Россия, Москва</option>
                        </select>
                    </div>

                    <div>
                        <label class="profile-form__field-label">Имя пользователя</label>
                        <input class="profile-form__input" name="username" />
                    </div>

                    <div>
                        <label class="profile-form__field-label">Email</label>
                        <input class="profile-form__input" name="email" />
                    </div>

                </div>

                <div class="profile-form__actions">
                    <button class="profile-form__submit" type="submit">
                        Сохранить изменения
                    </button>
                </div>
            </form>
        </section>


        <!-- ===== ВАШ УРОВЕНЬ ===== -->
        <section class="profile-section profile-section--level">
            <h2 class="profile-content__title">Ваш уровень</h2>

            <div id="testResultBlock"></div>

            <div id="testActions" style="margin-top:20px; display:none;">
                <button id="retryTestBtn">Сдать тест заново</button>
                <button id="historyBtn">История попыток</button>
            </div>

            <div id="historyBlock" style="margin-top:20px; display:none;"></div>
        </section>

    </main>

</div>

<script src="authFetch.js"></script>
<script src="profile.js"></script>
<script src="usersidebar.js"></script>
<script src="mycourses.js"></script>
</body>
</html>
