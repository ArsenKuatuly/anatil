<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Онлайн тест</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>

<div class="exam">

    <header class="exam__header">
        <div class="exam__logo">Тест на казахский</div>

        <div class="exam__timer" id="timer"></div>

        <button class="exam__finish" type="button">
            Завершить тестирование
        </button>
    </header>

    <nav class="exam__subjects">
        <button class="exam__subject exam__subject--active" data-subject="math">
            Перевод слов
        </button>
        <button class="exam__subject" data-subject="reading">
            Грамотность
        </button>
        <button class="exam__subject" data-subject="listening">
            Слушание
        </button>
    </nav>


    <div class="exam__card">



        <!-- Общая аудиозапись для всего раздела -->
        <div class="exam__audio exam__audio--global" id="globalAudioBlock">
            <p class="exam__audio-title">Аудио для всего задания</p>
            <audio controls id="globalAudio">
                <source src="audio/textexam.mp3" type="audio/mpeg">
                Ваш браузер не поддерживает аудио.
            </audio>
        </div>
        <div class="exam__info">
            <span class="exam__counter">
                Вопрос: <b id="current">1</b>/10
            </span>
            <span class="exam__type">
                Тип: один правильный ответ
            </span>
        </div>





        <div class="exam__question" id="question"></div>

        <div class="exam__answers" id="answers"></div>

        <div class="exam__footer">
            <span class="exam__progress" id="progress">
                1 / 10
            </span>

            <button class="exam__btn exam__btn--prev" id="prevBtn" disabled>
                ← Предыдущий
            </button>

            <button class="exam__next" id="nextBtn" disabled>
                Следующий вопрос →
            </button>
        </div>

    </div>

</div>

<div class="modal" id="finishModal">
    <div class="modal__content">
        <h3 class="modal__title">Завершить тестирование?</h3>
        <p class="modal__text">
            Вы уверены, что хотите завершить экзамен?
            Все ответы будут сохранены, таймер остановится.
        </p>

        <div class="modal__actions">
            <button class="modal__btn modal__btn--cancel" id="cancelFinish">
                Отмена
            </button>
            <button class="modal__btn modal__btn--confirm" id="confirmFinish">
                Завершить
            </button>
        </div>
    </div>
</div>

<script src="authFetch.js"></script>
<script type="module" src="test.js"></script>
<script src="slushanie.js"></script>

</body>
</html>
