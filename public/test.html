<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Онлайн тест</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>

<div class="exam">

    <header class="exam__header">
        <div class="exam__logo">Тест на казахский</div>

        <div class="exam__timer" id="timer">10:00</div>

        <button class="exam__finish" type="button">
            Завершить тестирование
        </button>
    </header>

    <nav class="exam__subjects">
        <button class="exam__subject exam__subject--active" data-subject="math">
            Перевод слов
        </button>
        <button class="exam__subject" data-subject="reading">
            Грамотность
        </button>
        <button class="exam__subject" data-subject="listening">
            Слушание
        </button>
    </nav>


    <div class="exam__card">

        <div class="exam__info">
            <span class="exam__counter">
                Вопрос: <b id="current">1</b>/10
            </span>
            <span class="exam__type">
                Тип: один правильный ответ
            </span>
        </div>

        <div class="exam__question" id="question"></div>

        <div class="exam__answers" id="answers"></div>

        <div class="exam__footer">
            <span class="exam__progress" id="progress">
                1 / 10
            </span>

            <button class="exam__next" id="nextBtn" disabled>
                Следующий вопрос →
            </button>
        </div>

    </div>

</div>

<script src="test.js"></script>
</body>
</html>
